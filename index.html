
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#005a9c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Capelania Pro">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="description" content="Sistema Profissional de Capelania Hospitalar - HAB/HABA">
    <link rel="manifest" href="/manifest.json">

    <!-- Open Graph: quando o link do app é colado numa mensagem (WhatsApp, etc.), o app do
         destinatário busca essas tags e monta um cartão de prévia com imagem, título e
         descrição automaticamente -- sem isso, o link aparece "pelado", sem nenhuma imagem. -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://capelaniaprov2.vercel.app/">
    <meta property="og:title" content="Capelania Pro">
    <meta property="og:description" content="Sistema Profissional de Capelania Hospitalar - HAB/HABA">
    <meta property="og:image" content="https://capelaniaprov2.vercel.app/logo_hospital.png">
    <meta property="og:image:width" content="256">
    <meta property="og:image:height" content="256">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Capelania Pro">
    <meta name="twitter:description" content="Sistema Profissional de Capelania Hospitalar - HAB/HABA">
    <meta name="twitter:image" content="https://capelaniaprov2.vercel.app/logo_hospital.png">
    
    <!-- Favicon E ícone de instalação (tela inicial/launcher): logo do Hospital Adventista
         de Belém (public/logo_hospital.png), gerado em favicon-32x32.png / favicon-16x16.png
         / apple-touch-icon.png / icon-192.png / icon-512.png (esses dois últimos usados no
         manifest do PWA em vite.config.ts). -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

    <title>Capelania Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <!-- CONFIG_INJECTION -->
</head>
<body class="text-slate-900 antialiased overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
</body>
</html>
